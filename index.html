html{scroll-behavior:smooth;scroll-padding-top:80px}
*{box-sizing:border-box}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}

nav{display:flex;align-items:center;justify-content:space-between;height:64px;gap:12px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.2rem;letter-spacing:-.02em;color:var(--text);text-decoration:none}
.logo b{color:var(--red)}
.menu{display:flex;gap:26px}
.menu a{color:var(--muted);text-decoration:none;font-size:.93rem;font-weight:500}
.menu a:hover{color:var(--red)}
.lang{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:3px}
.lang button{border:0;background:none;color:var(--muted);font:600 .78rem inherit;font-family:inherit;padding:6px 11px;border-radius:99px;cursor:pointer}
.lang button.on{background:var(--red);color:#fff}
@media(max-width:760px){.menu{display:none}}
.hero{position:relative;overflow:hidden;padding:96px 0 84px}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;filter:blur(70px);z-index:0}
.hero::before{width:420px;height:420px;background:var(--glow);top:-120px;right:-80px}
.hero::after{width:380px;height:380px;background:var(--glow2);bottom:-160px;left:-100px}
.hero .wrap{position:relative;z-index:1}
.pill{display:inline-flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);font-size:.82rem;font-weight:600;padding:6px 14px;border-radius:99px;margin-bottom:22px}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--red)}
h1{font-size:clamp(2.4rem,7vw,4.6rem);line-height:1.05;margin:0 0 20px;letter-spacing:-.035em;max-width:760px}
h1 span{background:linear-gradient(90deg,var(--red),var(--navy));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{max-width:560px;color:var(--muted);font-size:1.12rem;margin:0 0 32px}
.btn{display:inline-block;background:var(--red);color:#fff;text-decoration:none;font-weight:600;padding:14px 28px;border-radius:14px;box-shadow:0 10px 24px -10px var(--red)}
.btn.alt{background:var(--surface);color:var(--text);border:1px solid var(--line);box-shadow:none;margin-left:8px}
section{padding:72px 0}
.eyebrow{color:var(--red);font-weight:700;font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;margin-bottom:8px}
h2{font-size:clamp(1.8rem,4.5vw,2.7rem);margin:0 0 10px;letter-spacing:-.025em;line-height:1.15}
.sub{color:var(--muted);margin:0 0 36px;max-width:560px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:26px;transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-4px);box-shadow:0 18px 40px -20px var(--navy)}
.ic{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-size:1.6rem;background:linear-gradient(135deg,var(--glow),var(--glow2));margin-bottom:16px}
.card h3{margin:0 0 6px;font-size:1.08rem}
.card p{margin:0;color:var(--muted);font-size:.93rem}
.dark{background:linear-gradient(135deg,#0f3260,#174B8B);color:#fff;border-radius:32px;padding:56px 32px;margin:0 20px}
.dark .sub{color:#c9d8ee}
.dark .card{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.18)}
.dark .card p{color:#c9d8ee}
.dark .eyebrow{color:#ff8c96}
.contact{text-align:center}
.contact .sub{margin:0 auto 24px}
.ci{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.ci .btn{margin:0}
.cat{cursor:pointer}.more{display:inline-block;margin-top:14px;color:var(--red);font-weight:600;font-size:.88rem}
#m{position:fixed;inset:0;z-index:20;display:none;background:rgba(8,14,28,.55);backdrop-filter:blur(4px);align-items:flex-end;justify-content:center}
#m.open{display:flex}
.sheet{background:var(--bg);width:100%;max-width:760px;max-height:88%;overflow:auto;border-radius:26px 26px 0 0;padding:24px 20px calc(24px + env(safe-area-inset-bottom,0px));border:1px solid var(--line)}
@media(min-width:760px){#m{align-items:center}.sheet{border-radius:26px;max-height:80%}}
.sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;gap:12px}
.sh h3{margin:0;font-size:1.35rem}
.sh button{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:99px;padding:8px 16px;font:600 .85rem inherit;font-family:inherit;cursor:pointer}
.items{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px}
.item h4{margin:0 0 6px;font-size:1rem}
.pic{height:96px;border-radius:14px;margin-bottom:12px;display:grid;place-items:center;font-size:3rem;background:linear-gradient(135deg,var(--glow),var(--glow2))}
.price{font-size:1.4rem;font-weight:800;color:var(--red);margin-bottom:10px}
.ask{color:var(--text);font-weight:600;font-size:.85rem;text-decoration:underline}
footer{border-top:1px solid var(--line);padding:28px 0;text-align:center;color:var(--muted);font-size:.88rem}
